:root{--bg:#F7F6F2;--card:#FFFFFF;--ink:#181423;--muted:#5B566A;--line:#DAD6CC;--green:#389B54;--greenD:#2B7A42;--err:#B3261E}
@media (prefers-color-scheme:dark){:root{--bg:#14121A;--card:#1E1B27;--ink:#F1EFF6;--muted:#A9A4B8;--line:#363147;--green:#4DB36A;--greenD:#4DB36A;--err:#FF8A80}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;min-height:100vh}
.bar{background:#389B54;height:10px}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px}
h1{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:1.6rem;line-height:1.2;margin:0 0 8px}
p{margin:0 0 18px;color:var(--muted);line-height:1.45;font-size:.97rem}
label{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:1rem;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
input:focus{outline:2px solid var(--green);outline-offset:1px}
button{font:inherit;font-weight:600;border:0;border-radius:9px;padding:11px 18px;background:var(--green);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--greenD);border:1px solid var(--line);padding:11px 12px;font-weight:500}
button:disabled{opacity:.6;cursor:wait}
#msg{min-height:1.3em;margin:12px 0 0;font-size:.9rem;color:var(--err)}
#msg.ok{color:var(--muted)}
noscript{display:block;margin-top:12px;color:var(--err)}
</style>
</head>

<form class="card" id="f" autocomplete="off">

<p>Este tablero es de acceso restringido. Ingresá la clave que te compartieron para verlo.</p>

</div>
<div class="row" style="margin-top:12px"><button type="submit" id="go" style="flex:1">Ingresar</button></div>
<div id="msg" role="status" aria-live="polite"></div>
<noscript>Se necesita JavaScript para abrir el tablero.</noscript>
